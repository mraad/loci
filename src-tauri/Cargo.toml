[package]
name = "loci-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "loci"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
loci-core = { path = "../crates/loci-core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
